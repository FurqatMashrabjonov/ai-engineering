[project]
name = "ai-engineering"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "furqat", email = "mashrabjonovfurqat@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dirdotenv>=0.0.3",
    "jupyter>=1.1.1",
    "markitdown[all]>=0.1.9",
    "numpy>=2.4.6",
    "openai>=3.49.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "pymupdf>=2.1",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.3.0",
]

[project.scripts]
ai-engineering = "ai_engineering:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
